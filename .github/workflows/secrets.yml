name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner and inspect history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$tool_dir"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --redact --no-banner --log-opts="--all"
