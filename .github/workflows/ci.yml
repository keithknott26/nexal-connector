name: neXal Connector verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: connector
      - run: go vet ./... && go test -race ./...
        working-directory: runtimes/bridge
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/nexal-darwin-arm64 ./cmd/nexal
        working-directory: connector
      # The release DMG is universal, so a broken amd64 build must fail HERE
      # rather than at tag time on a machine nobody is watching.
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/nexal-darwin-amd64 ./cmd/nexal
        working-directory: connector
  mlx-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=runtimes python -m unittest discover -s runtimes/tests -p 'test*.py'
  mac:
    # Explicit manual run only: private macOS runners may incur charges.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go test -race ./...
        working-directory: connector
      - run: swift test
        working-directory: macos
      - run: bash macos/scripts/package-app.sh
