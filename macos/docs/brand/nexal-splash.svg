<g fill="none" stroke="#fff" stroke-width="1.5">
<animate attributeName="opacity" values="1;1;0.12" keyTimes="0;0.744;0.802" dur="4.3s" fill="freeze"/>
<path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" stroke-linejoin="round" d="M68 110C52 110 54 86 70 86C74 70 96 68 100 82C116 82 124 108 112 110Z"><animate attributeName="stroke-dashoffset" values="1;0" dur="0.8s" fill="freeze"/></path>
<g stroke-width="0.8" stroke-dasharray="1" stroke-dashoffset="1"><line pathLength="1" x1="37" y1="150" x2="67" y2="180"/><line pathLength="1" x1="67" y1="180" x2="113" y2="180"/><line pathLength="1" x1="113" y1="180" x2="143" y2="150"/><line pathLength="1" x1="37" y1="150" x2="143" y2="150"/><line pathLength="1" x1="37" y1="150" x2="113" y2="180"/><line pathLength="1" x1="67" y1="180" x2="143" y2="150"/><line pathLength="1" x1="90" y1="112" x2="37" y2="143"/><line pathLength="1" x1="90" y1="112" x2="143" y2="143"/><animate attributeName="stroke-dashoffset" values="1;0" begin="1s" dur="0.8s" fill="freeze"/></g>
<g opacity="0" fill="#000"><rect x="24" y="144" width="12" height="12" rx="3"/><rect x="54" y="174" width="12" height="12" rx="3"/><rect x="114" y="174" width="12" height="12" rx="3"/><rect x="144" y="144" width="12" height="12" rx="3"/><animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.5s" fill="freeze"/></g>
</g>
<g fill="none" stroke="#fff" stroke-width="2.2" opacity="0"><path d="M83 134v-6a7 7 0 0 1 14 0v6"/><rect x="78" y="134" width="24" height="18" rx="3" fill="#000"/><circle cx="90" cy="143" r="2" fill="#fff" stroke="none"/><animate attributeName="opacity" values="0;1" begin="3.25s" dur="0.25s" fill="freeze"/></g>
<g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" text-anchor="middle" dominant-baseline="middle">
<text x="90" y="222" fill="#fff" font-size="24" font-weight="500" letter-spacing="1">neXal</text>
<text x="92" y="245" fill="#fff" fill-opacity="0.7" font-size="12" letter-spacing="5">systems</text>
<text x="90" y="270" fill="#8C8C8C" font-size="11">quantum-safe</text>
<text x="90" y="285" fill="#8C8C8C" font-size="11">NIST level 5 encryption</text>
</g>
<line x1="40" y1="312" x2="140" y2="312" stroke="#222" stroke-width="2"/>
<line x1="40" y1="312" x2="140" y2="312" stroke="#fff" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0" dur="3.2s" fill="freeze"/></line>
</svg>
