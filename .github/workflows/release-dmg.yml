name: Release DMG

# Produces a signed, notarized, stapled .dmg for Nexal Connector.
#
# WHY MANUAL/TAG ONLY: macOS runners bill at 10x the Linux rate, and notarization
# calls Apple's service. This never runs on an ordinary push.
#
# UNSIGNED FALLBACK: with no signing secrets configured the job still runs and
# uploads an UNSIGNED artifact, clearly labelled. Gatekeeper will refuse it on
# another Mac. That is deliberate: the pipeline is verifiable before certificates
# exist, and an unsigned build is never published as a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the DMG to a GitHub Release (tag runs only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    # Write is needed ONLY by the final publish step (gh release). The workflow
    # default above stays read so every other step runs with the lower privilege.
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: false

      # Gate the release on the same tests CI runs. A release must never be the
      # first place these run.
      - name: Go tests
        working-directory: connector
        run: go vet ./... && go test -race ./...

      - name: Swift tests
        working-directory: macos
        run: swift test

      # Reuses the existing recipe rather than duplicating bundle assembly, so
      # local packaging and release packaging cannot drift apart.
      - name: Assemble unsigned app bundle
        run: bash macos/scripts/package-app.sh

      # Decide signing once, so later steps never half-sign.
      - name: Determine signing availability
        id: signing
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PW: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$CERT" ] && [ -n "$TEAM" ] && [ -n "$APPLE_ID" ] && [ -n "$NOTARY_PW" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets absent. Producing an UNSIGNED DMG that Gatekeeper will reject. It will not be published."
          fi

      # Ephemeral keychain: created here, deleted in Cleanup even on failure, so
      # the certificate never persists on the runner image.
      - name: Import signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/nexal-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 32)"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$P12"
          # Lets codesign use the key without an interactive prompt on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      # Hardened runtime is REQUIRED for notarization. Inside-out order matters:
      # the embedded Go helper must be signed before the bundle that contains it,
      # or the outer signature seals an unsigned executable and fails validation.
      - name: Sign
        if: steps.signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="macos/build/Nexal Connector.app"
          IDENTITY="Developer ID Application: ${{ secrets.APPLE_SIGNING_IDENTITY_NAME }} ($TEAM_ID)"
          codesign --force --timestamp --options runtime \
            --keychain "$SIGNING_KEYCHAIN" --sign "$IDENTITY" \
            "$APP/Contents/Helpers/nexal"
          codesign --force --timestamp --options runtime \
            --keychain "$SIGNING_KEYCHAIN" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build DMG
        id: build
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            macos/Resources/Info.plist)"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            NAME="Nexal-Connector-$VERSION-arm64.dmg"
          else
            NAME="Nexal-Connector-$VERSION-arm64-UNSIGNED-DO-NOT-DISTRIBUTE.dmg"
          fi
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "macos/build/Nexal Connector.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # UDZO is compressed and read-only, which is what Gatekeeper expects.
          hdiutil create -volname "Nexal Connector" -srcfolder "$STAGE" \
            -ov -format UDZO "$RUNNER_TEMP/$NAME"
          echo "dmg=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The DMG itself is signed too, so the download is verifiable before mounting.
      - name: Sign, notarize and staple the DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="${{ steps.build.outputs.dmg }}"
          codesign --force --timestamp --keychain "$SIGNING_KEYCHAIN" \
            --sign "Developer ID Application: ${{ secrets.APPLE_SIGNING_IDENTITY_NAME }} ($TEAM_ID)" "$DMG"
          # --wait blocks until Apple returns a verdict; a rejection fails the job.
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          # Stapling embeds the ticket so first launch works offline.
          xcrun stapler staple "$DMG"
          # Proves Gatekeeper will accept it, rather than assuming.
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      # shasum records the path exactly as it is given, so hashing an absolute
      # path writes the CI runner's /Users/runner/work/_temp/... into the file.
      # Every customer who downloaded it then got "No such file or directory"
      # from `shasum -c`, because that path exists only on the build machine.
      # Hash the basename from inside its directory so the checksum file names
      # the DMG the way the person verifying it actually has it: sitting in the
      # same folder, usually ~/Downloads.
      - name: Checksum
        run: |
          set -euo pipefail
          DMG="${{ steps.build.outputs.dmg }}"
          cd "$(dirname "$DMG")"
          shasum -a 256 "$(basename "$DMG")" | tee "$(basename "$DMG").sha256"
          # Verify here so a broken checksum file fails the build, not the customer.
          shasum -a 256 -c "$(basename "$DMG").sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            ${{ steps.build.outputs.dmg }}
            ${{ steps.build.outputs.dmg }}.sha256
          if-no-files-found: error

      # Publishing requires a tag AND a signed build: an unsigned DMG is never
      # attached to a release, because Gatekeeper would reject every download.
      - name: Publish release
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" --generate-notes --verify-tag \
            "${{ steps.build.outputs.dmg }}" "${{ steps.build.outputs.dmg }}.sha256" \
            || gh release upload "${{ github.ref_name }}" \
               "${{ steps.build.outputs.dmg }}" "${{ steps.build.outputs.dmg }}.sha256" --clobber

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
