name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner and inspect history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          archive="gitleaks_8.30.1_darwin_arm64.tar.gz"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern "$archive" --pattern gitleaks_8.30.1_checksums.txt --dir "$tool_dir"
          expected="$(awk -v name="$archive" '$2 == name { print $1 }' "$tool_dir/gitleaks_8.30.1_checksums.txt")"
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" "$tool_dir/$archive" | shasum -a 256 -c -
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --redact --no-banner --log-opts="--all"
