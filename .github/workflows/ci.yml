name: neXal-Connector verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: connector
      - run: go vet ./... && go test -race ./...
        working-directory: runtimes/bridge
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/nexal-darwin-arm64 ./cmd/nexal
        working-directory: connector
      # The release DMG is universal, so a broken amd64 build must fail HERE
      # rather than at tag time on a machine nobody is watching.
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/nexal-darwin-amd64 ./cmd/nexal
        working-directory: connector
  mlx-policy:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The self-hosted Apple-silicon runner already has Homebrew Python. Avoid
      # setup-python here: its hosted-toolcache installer targets /Users/runner,
      # which is not writable by the registered runner account.
      - name: Run MLX policy tests
        run: PYTHONPATH=runtimes /opt/homebrew/bin/python3 -m unittest discover -s runtimes/tests -p 'test*.py'
  mac:
    # Self-hosted, and no longer gated to workflow_dispatch.
    #
    # It ran on macos-15 behind a manual gate to avoid hosted-macOS charges. The result
    # was that the Mac app was never compiled on a push: the Swift sources are edited
    # without a Swift toolchain available, so a type error could reach main and sit
    # there. GitHub then refused to start hosted jobs at all when the account allowance
    # was exhausted, which made the manual gate moot as well.
    #
    # Requires a runner registered against THIS repository. A personal account has no
    # organization-wide runners, so the Mac must be registered per repo:
    #   REPO=keithknott26/nexal-connector bash scripts/setup-self-hosted-runner.sh
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify local Xcode toolchain is licensed
        run: xcodebuild -version
      # Persistent runners do not start clean, and a stale .build directory can mask a
      # source file that no longer compiles.
      - name: Discard previous Swift build output
        run: rm -rf macos/.build
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: go test -race ./...
        working-directory: connector
      # Split from `swift test` on purpose: a compile failure and a failing assertion
      # are different problems, and the build step names which one happened.
      - name: Compile the Mac app
        run: swift build 2>&1 | tee /tmp/swift-build.log
        working-directory: macos
      - run: swift test
        working-directory: macos
      # Packaging is a release concern and needs a signing identity, so it stays behind
      # an explicit manual run rather than gating every push on it.
      - name: Package the app bundle
        if: github.event_name == 'workflow_dispatch'
        run: bash macos/scripts/package-app.sh
