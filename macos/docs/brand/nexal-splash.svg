<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 340" role="img" aria-label="neXal systems. Quantum-safe, NIST level 5 encryption.">
<!-- Same animation as NexalSplashView.swift: plays once (4.3 s) and holds on the lock. -->
